name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback. Pick the tag from the Actions UI when an automatic
  # run gets stuck (transient HTTP 403, PyPI propagation delay, etc.)
  # and rerun the full workflow without retagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to re-run (e.g. v0.0.15). Defaults to the branch ref."
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Lockfile check
        run: uv lock --check
      - name: Validate tag matches pyproject version
        run: |
          set -euo pipefail
          project_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          tag_version="${RELEASE_TAG#v}"
          echo "RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          test "$project_version" = "$tag_version"
      - name: Install
        run: uv sync --all-extras --dev --python 3.13
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: PYTHONWARNINGS=error::ResourceWarning uv run pytest
      - name: Install Playwright Chromium
        run: uv run --with playwright==1.52.0 playwright install --with-deps chromium
      - name: Browser layout regression
        run: |
          CALIPER_BROWSER_LAYOUT=1 \
            uv run --with playwright==1.52.0 \
            pytest tests/test_dashboard_responsive_layout.py -q
      - name: Coverage
        run: uv run pytest --cov=src/caliper --cov-report=term
      - name: Build distributions
        run: |
          rm -rf dist
          uv run python -m build
      - name: Check distributions
        run: uvx twine check dist/*
      - name: Smoke wheel entry point
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          uvx --from "$wheel" caliper --version
          uvx --from "$wheel" caliper --help
          tmp="$(mktemp -d)"
          uvx --from "$wheel" caliper dashboard --demo --output "$tmp/dashboard.html"
          test -s "$tmp/dashboard.html"
          python - "$tmp/dashboard.html" <<'PY'
          from pathlib import Path
          import sys

          import re
          html = Path(sys.argv[1]).read_text(encoding="utf-8")
          # Exactly one EXECUTABLE inline script (`<script>` with no type
          # attribute). Non-executable data blocks like the cmd+K palette
          # index (`<script type="application/json">`) are data, not
          # behaviour, and don't count against the privacy gate.
          assert html.count("<script>") == 1, "expected exactly one executable inline dashboard script"
          # Every <script> open has a matching close; any extra script tag
          # MUST carry type="application/json" so it can't execute.
          opens = re.findall(r"<script(\s[^>]*)?>", html)
          closes = html.count("</script>")
          assert closes == len(opens), "open/close <script> mismatch"
          for attrs in opens:
              if attrs and attrs.strip():
                  assert 'type="application/json"' in attrs, (
                      f"unexpected non-JSON <script> attrs {attrs!r}"
                  )
          # `://` already catches any external URL inside any tag, so the
          # inline-data favicon (`<link rel="icon" href="data:…">`) is allowed.
          for needle in ("://", " src=", "fetch(", "XMLHttpRequest", "import("):
              assert needle not in html, f"dashboard privacy gate found {needle!r}"
          PY
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          uvx --from cyclonedx-bom cyclonedx-py environment "$(uv run python -c 'import sys; print(sys.prefix)')" \
            --output-format json \
            --output-file dist/caliper-ai-${RELEASE_TAG#v}.cdx.json
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  github-draft:
    name: Stage GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - name: Extract release notes
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## {re.escape(version)}(?:\s+-[^\n]*)?\n(?P<body>.*?)(?=^## |\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit(f"Could not find CHANGELOG notes for {version}")
          Path("RELEASE_NOTES.md").write_text(match.group("body").strip() + "\n", encoding="utf-8")
          PY
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          # Transient HTTP 403 has hit this step under high API load.
          # Retry three times with a short backoff before giving up.
          for attempt in 1 2 3; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" dist/* --clobber \
                 && gh release edit "$tag" --draft --title "$tag" \
                      --notes-file RELEASE_NOTES.md --latest=false; then
                exit 0
              fi
            else
              if gh release create "$tag" dist/* --draft --verify-tag \
                   --title "$tag" --notes-file RELEASE_NOTES.md --latest=false; then
                exit 0
              fi
            fi
            echo "stage attempt $attempt failed; sleeping 10s..."
            sleep 10
          done
          echo "Stage GitHub release failed after 3 attempts."
          exit 1

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: github-draft
    environment:
      name: pypi
      url: https://pypi.org/project/caliper-ai/
    permissions:
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - name: Remove non-distribution artifacts before upload
        run: |
          set -euo pipefail
          # Keep only sdist/wheel; SBOM and attestations are not PyPI artifacts.
          find dist -maxdepth 1 -type f ! \( -name '*.whl' -o -name '*.tar.gz' \) -print -delete
          ls -la dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
          verbose: true

  github-publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: write
    steps:
      - name: Publish staged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          # Same transient HTTP 403 mitigation as the staging step.
          for attempt in 1 2 3; do
            if gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest; then
              exit 0
            fi
            echo "publish attempt $attempt failed; sleeping 10s..."
            sleep 10
          done
          echo "Publish GitHub release failed after 3 attempts."
          exit 1

  post-release-smoke:
    name: Verify the published release installs
    runs-on: ubuntu-latest
    needs: github-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - name: Resolve published version
        id: ver
        run: |
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Resolve published wheel URL
        id: published-wheel
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          metadata_url = f"https://pypi.org/pypi/caliper-ai/{version}/json"
          last_error: Exception | None = None

          def wheel_from_metadata() -> str | None:
              try:
                  with urllib.request.urlopen(metadata_url, timeout=10) as response:  # nosec B310
                      payload = json.load(response)
              except OSError as exc:
                  global last_error
                  last_error = exc
                  return None

              wheels = [
                  item
                  for item in payload.get("urls", [])
                  if item.get("filename", "").endswith(".whl")
              ]
              if len(wheels) != 1:
                  raise SystemExit(f"Expected one wheel for {version}, found {len(wheels)}")
              wheel = wheels[0]
              digest = wheel.get("digests", {}).get("sha256")
              if not digest:
                  raise SystemExit(f"Wheel for {version} is missing a SHA-256 digest")
              return f"{wheel['url']}#sha256={digest}"

          def wheel_from_dist() -> str:
              wheels = sorted(Path("dist").glob("*.whl"))
              if len(wheels) != 1:
                  raise SystemExit(f"Expected one built wheel, found {len(wheels)}")
              wheel = wheels[0]
              content = wheel.read_bytes()
              blake2 = hashlib.blake2b(content, digest_size=32).hexdigest()
              sha256 = hashlib.sha256(content).hexdigest()
              return (
                  "https://files.pythonhosted.org/packages/"
                  f"{blake2[:2]}/{blake2[2:4]}/{blake2[4:]}/{wheel.name}#sha256={sha256}"
              )

          def exists(url: str) -> bool:
              request = urllib.request.Request(url.split("#", 1)[0], method="HEAD")
              try:
                  with urllib.request.urlopen(request, timeout=10):  # nosec B310
                      return True
              except OSError:
                  return False

          for _attempt in range(1, 9):
              wheel_url = wheel_from_metadata() or wheel_from_dist()
              if exists(wheel_url):
                  print(f"wheel_url={wheel_url}")
                  break
              time.sleep(15)
          else:
              raise SystemExit(f"Could not resolve published wheel URL for {version}: {last_error}")
          PY
      - name: Install from PyPI and smoke-test
        run: |
          set -euo pipefail
          # Allow the PyPI index a moment to propagate the new release.
          # 8 x 15s = 2 minutes is enough on a typical day.
          for i in 1 2 3 4 5 6 7 8; do
            if uvx --refresh --from "caliper-ai==${{ steps.ver.outputs.version }}" caliper --version; then
              exit 0
            fi
            echo "Attempt $i: PyPI index lag, sleeping 15s..."
            sleep 15
          done
          echo "Published release did not resolve by name within retry budget; using verified wheel URL."
          uvx --from "${{ steps.published-wheel.outputs.wheel_url }}" caliper --version
      - name: Run published dashboard smoke
        env:
          CALIPER_SMOKE_WHEEL_URL: ${{ steps.published-wheel.outputs.wheel_url }}
        run: |
          set -euo pipefail
          CALIPER_SMOKE_VERSION="${RELEASE_VERSION}" bash scripts/live-release-smoke.sh
